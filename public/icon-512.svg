<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners for app icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Stack card 2 behind (rotated left) -->
  <rect x="110" y="140" width="280" height="240" rx="28" fill="#1e293b" opacity="0.6" transform="rotate(-8 250 260)" />

  <!-- Stack card 1 behind (rotated right) -->
  <rect x="130" y="130" width="280" height="240" rx="28" fill="#38bdf8" opacity="0.8" transform="rotate(6 270 250)" />

  <!-- Main front card -->
  <rect x="116" y="120" width="280" height="250" rx="28" fill="url(#cardGrad)" filter="url(#glow)" />
  
  <!-- Word letter 'W' styled with gradient -->
  <path d="M 180 180 L 210 290 L 256 210 L 302 290 L 332 180" fill="none" stroke="#0284c7" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Soundwave / Speaker mini spark -->
  <circle cx="345" cy="180" r="10" fill="#6366f1" />
  <path d="M 365 168 A 20 20 0 0 1 365 192" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" />
  <path d="M 378 160 A 32 32 0 0 1 378 200" fill="none" stroke="#6366f1" stroke-width="6" stroke-linecap="round" />
</svg>
